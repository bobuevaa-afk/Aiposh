<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Соскучились по мне?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Фон с летающими сердечками -->
  <div class="hearts-container" id="heartsContainer"></div>

  <!-- Фоновая музыка -->
  <audio id="bgMusic" src="music.mp3" loop></audio>

  <!-- Карточка -->
  <div class="card" id="card">
    
    <!-- ЭКРАН 1 -->
    <div class="step active" id="step1">
      <h2 class="title">Соскучились по мне? 💖</h2>
      <div class="btn-group">
        <button class="btn btn-primary" id="yesBtn1">Да, очень 💕</button>
        <button class="btn btn-secondary" id="noBtn">Нет 😜</button>
      </div>
    </div>

    <!-- ЭКРАН 2 -->
    <div class="step" id="step2">
      <div class="avatar-container">
        <img src="photo1.svg" alt="Фото" class="avatar">
        <span class="badge">НЕ ВЕРЮ! 🤫</span>
      </div>
      <div class="btn-group">
        <button class="btn btn-primary" id="yesBtn2">Ладно, скучаю 🥹</button>
      </div>
    </div>

    <!-- ЭКРАН 3 -->
    <div class="step" id="step3">
      <h2 class="title">Я так и знала!<br>Держите, мои хорошие 🌼</h2>
      <div class="icon">🐱</div>
      <div class="btn-group">
        <button class="btn btn-outline" id="yesBtn3">Нажми на ромашку ✨</button>
      </div>
    </div>

    <!-- ЭКРАН 4 -->
    <div class="step" id="step4">
      <h2 class="title">И ещё кое-что для тебя 💌</h2>
      <div class="envelope">✉️</div>
      <div class="btn-group">
        <button class="btn btn-outline" id="yesBtn4">Нажми на конверт ✉️</button>
      </div>
    </div>

    <!-- ЭКРАН 5 -->
    <div class="step" id="step5">
      <p class="love-text">Я вас люблю, <br><strong>Родня!</strong> 💕<br><br>Каждый день с вами — любовки мои.</p>
      <p class="subtext">— Ваша дочь 🫶</p>
      <div class="btn-group">
        <button class="btn btn-primary" id="yesBtn5">Мы тебя тоже ~ 💖</button>
      </div>
    </div>

    <!-- ЭКРАН 6 (Финал) -->
    <div class="step" id="step6">
      <div class="avatar-container large">
        <img src="WhatsApp Image 2026-09-05 at 10.57.50.jpeg" alt="Фото" class="avatar" onerror="this.src='photo1.svg'">
        <div class="badge">Сюрприз! 🎁</div>
      </div>
      <h2 class="title" style="margin-top: 15px;">Это ваша дочь 🤪💖</h2>
    </div>

  </div>

  <script src="./script.js" defer></script>  
</body>
</html>
